# Production (Render + Neon): values come from the environment, no defaults. A missing variable stops startup.
# Deploy guide: docs/DEPLOY.md
spring:
  datasource:
    # Direct (non-pooler) Neon endpoint, JDBC form, sslmode=require (checked by DatabaseSslGuard). See K19.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Neon free: keep it small, and hold no idle connections so the compute can scale to zero.
      # Hikari timeouts are plain milliseconds (no 2m/20s duration syntax here).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 900000
      connection-timeout: 20000
      data-source-properties:
        sslmode: require
  # Flyway uses the same DataSource (and thus the same direct connection).

server:
  tomcat:
    threads:
      # 512 MB instance: fewer threads, less stack memory.
      max: 20

tekpas:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: true
  client-ip:
    # client -> Vercel (rewrite) -> Render. Live check (10.10.2026): Render sees 2 entries (xff=2), but Vercel
    # passes a client's own X-Forwarded-For through on the rewrite, so the first entry can be forged. The
    # client IP is off (-1): per-token limits plus general counters. Next: Vercel's own header (x-real-ip or
    # x-vercel-forwarded-for), once it is confirmed to reach Render.
    trusted-proxies: -1
  cors:
    # Optional: the web app goes through its own origin (K18), so CORS stays off unless origins are listed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
