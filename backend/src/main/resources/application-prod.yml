# Production (Render + Neon): values come from the environment, no defaults. A missing variable stops startup.
# Deploy guide: docs/DEPLOY.md
spring:
  datasource:
    # Direct (non-pooler) Neon endpoint, JDBC form, sslmode=require (checked by DatabaseSslGuard). See K19.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Neon free: keep it small, and hold no idle connections so the compute can scale to zero.
      # Hikari timeouts are plain milliseconds (no 2m/20s duration syntax here).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 900000
      connection-timeout: 20000
      data-source-properties:
        sslmode: require
  # Flyway uses the same DataSource (and thus the same direct connection).

server:
  tomcat:
    threads:
      # 512 MB instance: fewer threads, less stack memory.
      max: 20

tekpas:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: true
  client-ip:
    # client -> Vercel (rewrite) -> Render: entries our proxies append to X-Forwarded-For after the one Vercel
    # saw (common/web/ClientIp). With 1 the live check (10.10.2026) keyed on changing addresses, not the
    # client, so the client IP is off (-1): per-token limits plus one general counter. Turn it back on with
    # the hop count from the access log ("xff=N" on /api/v1/public/ lines) once confirmed.
    trusted-proxies: -1
  cors:
    # Optional: the web app goes through its own origin (K18), so CORS stays off unless origins are listed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
