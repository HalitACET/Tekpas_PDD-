spring:
  application:
    name: tekpas-backend
  profiles:
    # No SPRING_PROFILES_ACTIVE -> local (docker-compose) with demo users. Prod sets it explicitly.
    default: local,demo
  autoconfigure:
    # Authentication is JWT only; no in-memory user with a generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    # API messages (validation defaults included) are English; the clients translate (CLAUDE.md rule 8).
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # Stable, sorted output: packages/api-client/openapi.json is generated from it and diffed in CI.
  writer-with-order-by-keys: true
  # Error responses are declared per endpoint (and typed as ApiProblem), not guessed from @ExceptionHandler.
  override-with-generic-response: false

tekpas:
  jwt:
    # At least 32 bytes, otherwise the application does not start.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    cookie-secure: true
    refresh-reuse-grace: PT10S
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  demo:
    password: ${DEMO_PASSWORD:}
