spring:
  application:
    name: tekpas-backend
  profiles:
    # No SPRING_PROFILES_ACTIVE -> local (docker-compose) with demo users. Prod sets it explicitly.
    default: local,demo
  autoconfigure:
    # Authentication is JWT only; no in-memory user with a generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # PATCH bodies use Optional fields: missing = null (unchanged), JSON null = Optional.empty() (clear).
      # Jackson 3's default would turn a missing field into Optional.empty() as well.
      USE_NULL_FOR_MISSING_REFERENCE_VALUES: true
      # 99.5 for an Integer field is a validation error (code "Integer"), never silently truncated to 99.
      ACCEPT_FLOAT_AS_INT: false
  servlet:
    multipart:
      # Documents (M5): 10 MB per file (PLAN K10); Spring's default of 1 MB would refuse every real certificate.
      # The request limit leaves room for the form fields and the multipart framing.
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    # API messages (validation defaults included) are English; the clients translate (CLAUDE.md rule 8).
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  tomcat:
    # An upload refused for its size is answered with 413 instead of a dropped connection: Tomcat reads on up to
    # this much of the unread body before it closes (its default is 2 MB).
    max-swallow-size: 12MB

logging:
  pattern:
    # Every log line of a request carries its X-Request-Id (common.web.RequestIdFilter puts it in the MDC).
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness does not touch the DB: Render health checks and the keep-awake cron use it,
      # so Neon can scale to zero. /actuator/health (with DB) is what the web badge shows.
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # Stable, sorted output: packages/api-client/openapi.json is generated from it and diffed in CI.
  writer-with-order-by-keys: true
  # Error responses are declared per endpoint (and typed as ApiProblem), not guessed from @ExceptionHandler.
  override-with-generic-response: false

tekpas:
  jwt:
    # At least 32 bytes, otherwise the application does not start.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    cookie-secure: true
    refresh-reuse-grace: PT10S
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  public:
    # Where the QR codes point to (PLAN K13): {base-url}/01/{gtin}/10/{batch}. No domain yet.
    base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  demo:
    password: ${DEMO_PASSWORD:}
  storage:
    # none: the application starts and document uploads answer 503 (production until the Supabase project exists).
    # local: files under local-dir (development). supabase: Supabase Storage over REST (see docs/DEPLOY.md).
    provider: ${STORAGE_PROVIDER:none}
    supabase:
      url: ${STORAGE_SUPABASE_URL:}
      service-key: ${STORAGE_SUPABASE_SERVICE_KEY:}
      bucket: ${STORAGE_BUCKET:}
  ai:
    llm:
      # LLM reading of what the rules cannot read (scans, photos), docs/m5-plan.md §3. Off unless switched on; even
      # then the LLM gate also needs GEMINI_API_KEY and a demo company (company.is_demo).
      enabled: ${LLM_ENABLED:false}
      # Our own cap on calls a day (Pacific time). Not Google's quota: check that in AI Studio on the demo day.
      daily-limit: ${LLM_DAILY_LIMIT:50}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # The model id as AI Studio lists it; never written in code.
      model: ${GEMINI_MODEL:}
      timeout: ${GEMINI_TIMEOUT:PT20S}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
  jobs:
    # Background jobs (K9). Tests switch the worker thread off and run the jobs themselves (JobWorker.runPending).
    worker-enabled: ${JOBS_WORKER_ENABLED:true}
