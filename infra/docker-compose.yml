# Local gelistirme servisleri. Backend/web/mobil makinede calisir.
# Kullanim: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tekpas
      POSTGRES_USER: tekpas
      POSTGRES_PASSWORD: tekpas
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekpas -d tekpas"]
      interval: 5s
      retries: 10

  # minio/minio artik yayinlanmiyor; Pigsty topluluk fork'u, sadece local gelistirme icin.
  # Sorun cikarsa B plani: chrislusf/seaweedfs.
  minio:                      # Supabase Storage'in (S3) local karsiligi
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tekpas
      MINIO_ROOT_PASSWORD: tekpas-secret
    ports: ["9000:9000", "9001:9001"]   # 9001 = web konsolu
    volumes: [miniodata:/data]

  minio-init:                 # bucket'i otomatik olusturur
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tekpas tekpas-secret; do sleep 1; done;
      mc mb --ignore-existing local/tekpas-docs;
      "

volumes:
  pgdata:
  miniodata:
