# Local gelistirme servisleri. Backend/web/mobil makinede calisir.
# Kullanim: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tekpas
      POSTGRES_USER: tekpas
      POSTGRES_PASSWORD: tekpas
    ports: ["5433:5432"]   # 5432 makinedeki baska bir Postgres servisine ait
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekpas -d tekpas"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
