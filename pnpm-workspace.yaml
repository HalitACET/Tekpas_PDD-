packages:
  - web
  - mobile
  - packages/*

engineStrict: true

# Build scripts are blocked by default; list explicit decisions here.
# All four ship prebuilt native binaries as per-platform optional dependencies;
# their scripts only build from source when no prebuilt binary matches.
allowBuilds:
  sharp: false            # next image optimization; uses @img/sharp-<platform> (0.35 has no install script)
  unrs-resolver: false    # eslint import resolver; uses @unrs/resolver-binding-<platform>
  '@parcel/watcher': false  # next-intl message extractor watch mode; uses @parcel/watcher-<platform>
  '@swc/core': false      # next-intl message extractor; uses @swc/core-<platform>

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - '@expo/ui@57.0.20'
  - babel-preset-expo@57.0.13
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.23
  - expo@57.0.25
